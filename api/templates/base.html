<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ViewPol{% endblock %}</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #111;
            color: #e8e8e8;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* ─── Navbar ─────────────────── */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 200;
            height: 54px;
            display: flex;
            align-items: center;
            padding: 0 28px;
            gap: 20px;
            background: rgba(13, 13, 13, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid #1e1e1e;
        }
        .navbar-brand {
            font-size: 17px;
            font-weight: 700;
            color: #f0f0f0 !important;
            text-decoration: none !important;
            letter-spacing: 0.2px;
            flex-shrink: 0;
        }
        .navbar-brand:hover { color: #4da6ff !important; }
        .navbar-divider {
            width: 1px;
            height: 18px;
            background: #2a2a2a;
            flex-shrink: 0;
        }
        .navbar-links {
            display: flex;
            align-items: center;
            gap: 4px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .navbar-links::-webkit-scrollbar { display: none; }
        .navbar-links a {
            color: #888 !important;
            text-decoration: none !important;
            font-size: 13.5px;
            font-weight: 500;
            padding: 5px 11px;
            border-radius: 7px;
            transition: color 0.15s, background 0.15s;
            white-space: nowrap;
        }
        .navbar-links a:hover {
            color: #e0e0e0 !important;
            background: #1c1c1c;
        }
        .nav-group {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .nav-group-label {
            font-size: 9.5px;
            font-weight: 700;
            color: #3a3a3a;
            text-transform: uppercase;
            letter-spacing: 1.3px;
            padding: 2px 6px 2px 3px;
            flex-shrink: 0;
            pointer-events: none;
            user-select: none;
        }

        /* ─── Page wrapper ───────────── */
        .page-wrapper {
            max-width: 1440px;
            margin: 0 auto;
            padding: 32px 28px 120px;
        }

        h1 {
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 24px;
            color: #f0f0f0;
        }

        /* ─── Back link ──────────────── */
        a.back-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #777 !important;
            text-decoration: none !important;
            font-size: 13px;
            font-weight: 500;
            padding: 5px 11px 5px 8px;
            border-radius: 7px;
            border: 1px solid #242424;
            background: #181818;
            margin-bottom: 22px;
            transition: all 0.15s;
        }
        a.back-link:hover {
            color: #ccc !important;
            border-color: #343434;
            background: #1e1e1e;
        }

        /* ─── Grids ──────────────────── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
        }
        .shopgrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 14px;
        }
        .nationgrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 2fr));
            gap: 14px;
        }

        /* ─── History charts ─────────── */
        .hist-section {
            background: #141414;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 16px 18px 14px;
            margin-bottom: 18px;
        }
        .hist-section h2 {
            margin: 0 0 12px;
            font-size: 13px;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .hist-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
        }
        .hist-tab {
            font-size: 11.5px;
            font-weight: 600;
            color: #555;
            padding: 3px 9px;
            border-radius: 5px;
            cursor: pointer;
            border: 1px solid transparent;
            background: none;
            transition: all 0.15s;
        }
        .hist-tab:hover  { color: #aaa; background: #1c1c1c; }
        .hist-tab.active { color: #e0e0e0; background: #1e1e1e; border-color: #303030; }
        .hist-svg-wrap {
            position: relative;
            width: 100%;
            height: 80px;
            overflow: hidden;
        }
        .hist-svg-wrap svg { width: 100%; height: 100%; overflow: visible; }
        .hist-empty {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #383838;
            font-size: 12px;
        }
        .hist-stats {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .hist-stat { display: flex; flex-direction: column; gap: 1px; }
        .hist-stat-val { font-size: 15px; font-weight: 700; color: #d8d8d8; }
        .hist-stat-lbl { font-size: 10.5px; color: #484848; text-transform: uppercase; letter-spacing: 0.6px; }
        .hist-tooltip {
            position: fixed;
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 7px;
            padding: 6px 10px;
            font-size: 12px;
            color: #e0e0e0;
            pointer-events: none;
            z-index: 9999;
            white-space: nowrap;
            line-height: 1.6;
            box-shadow: 0 4px 14px rgba(0,0,0,0.5);
        }

        /* ─── Cards ──────────────────── */
        .player-card {
            background: #181818;
            border: 1px solid #242424;
            padding: 16px;
            border-radius: 10px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.3);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
            cursor: pointer;
        }
        .player-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            border-color: #333;
        }
        .player-card img {
            width: 80px;
            height: 80px;
            margin-bottom: 2px;
        }

        /* ─── Links ──────────────────── */
        a {
            text-decoration: none;
            color: #4da6ff;
            font-weight: 500;
            font-size: 15px;
        }
        a:hover { color: #7dc0ff; }

        /* ─── Search bar ─────────────── */
        .search-bar {
            text-align: center;
            margin-bottom: 20px;
        }
        .search-bar form {
            display: inline-flex;
            gap: 8px;
            align-items: center;
        }
        .search-bar input {
            padding: 9px 13px;
            font-size: 13.5px;
            font-family: inherit;
            border-radius: 8px;
            border: 1px solid #272727;
            background: #181818;
            color: #e0e0e0;
            width: 280px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .search-bar input:focus {
            border-color: #3d7bd6;
            box-shadow: 0 0 0 3px rgba(61,123,214,0.14);
        }
        .search-bar input::placeholder { color: #555; }

        /* ─── Buttons ────────────────── */
        button {
            padding: 9px 16px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            font-size: 13.5px;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }
        button:hover { background: #3b82f6; }


        /* ─── Filters ────────────────── */
        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-group {
            display: flex;
            align-items: center;
            background: #161616;
            border: 1px solid #252525;
            border-radius: 9px;
            overflow: hidden;
            padding: 3px;
        }
        .filter-group input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }
        .filter-group label {
            display: block;
            padding: 6px 13px;
            margin: 0;
            font-size: 13px;
            font-weight: 500;
            color: #777;
            cursor: pointer;
            transition: all 0.15s;
            border-radius: 7px;
            white-space: nowrap;
        }
        .filter-group input[type="radio"]:checked + label {
            background: #2563eb;
            color: #fff;
        }
        .filter-group label:hover {
            background: #202020;
            color: #bbb;
        }

        @media (max-width: 768px) {
            .page-wrapper { padding: 20px 16px 120px; }
            .navbar { padding: 0 16px; gap: 10px; }
            .navbar-links a { padding: 5px 8px; font-size: 13px; }
            .nav-group-label { display: none; }
            .search-bar input { width: 220px; }
            .filters {
                flex-direction: column;
                gap: 10px;
                align-items: stretch;
            }
            .filter-group { justify-content: center; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">ViewPol</a>
        <div class="navbar-divider"></div>
        <div class="navbar-links">
            <div class="nav-group">
                <span class="nav-group-label">Political</span>
                <a href="/nations">🌍 Nations</a>
                <a href="/towns">🏘️ Towns</a>
                <a href="/players">👤 Players</a>
            </div>
            <div class="navbar-divider"></div>
            <div class="nav-group">
                <span class="nav-group-label">Economy</span>
                <a href="/shops">🏦 Shops</a>
                <a href="/malls">🏬 Malls</a>
                <a href="/items">📦 Items</a>
            </div>
            <div class="navbar-divider"></div>
            <div class="nav-group">
                <span class="nav-group-label">War</span>
                <a href="/sieges">⚔️ Sieges</a>
                <a href="/kitpvp">🗡️ KitPvP</a>
            </div>
        </div>
    </nav>
    <div class="page-wrapper">
        {% block content %}{% endblock %}
    </div>
    <script>
    /* Make entire card clickable — .player-card and .sg-group-card both
       contain an <a href> inside; clicking anywhere outside that link
       navigates to its href. Clicks on <a> / <button> children still work normally. */
    document.addEventListener('click', function (e) {
        const card = e.target.closest('.player-card, .sg-group-card');
        if (!card || e.target.closest('a, button')) return;
        const link = card.querySelector('a[href]');
        if (link) window.location.href = link.href;
    });

    /* ── renderHistChart ─────────────────────────────────────────────
       Generic deferred history sparkline used on player/town/nation/item pages.

       containerId  – id of the .hist-section wrapper div
       entries      – [{ts, ...values}] sorted by ts (from /api/history/*)
       series       – [{key, color, label}]   (1 or 2 lines)
       fmtVal       – optional value formatter fn(v) → string
    ── */
    function renderHistChart(containerId, entries, series, fmtVal) {
        const section = document.getElementById(containerId);
        if (!section) return;
        fmtVal = fmtVal || (v => v == null ? '—' : v.toLocaleString(undefined, {maximumFractionDigits: 2}));

        const TABS = [
            {label: '24h', ms: 86400000},
            {label: '3d',  ms: 259200000},
            {label: '7d',  ms: 604800000},
        ];
        let windowMs = 86400000;

        // ── build tabs ────────────────────────────────────────────
        const tabRow = section.querySelector('.hist-tabs');
        if (tabRow) {
            tabRow.innerHTML = TABS.map((t, i) =>
                `<button class="hist-tab${i===0?' active':''}" data-ms="${t.ms}">${t.label}</button>`
            ).join('');
            tabRow.addEventListener('click', e => {
                const btn = e.target.closest('.hist-tab');
                if (!btn) return;
                tabRow.querySelectorAll('.hist-tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                windowMs = +btn.dataset.ms;
                draw();
            });
        }

        // ── draw ──────────────────────────────────────────────────
        function draw() {
            const svgWrap = section.querySelector('.hist-svg-wrap');
            const statsEl = section.querySelector('.hist-stats');
            if (!svgWrap) return;

            const now = Date.now();
            const pts  = entries.filter(e => e.ts > now - windowMs);

            if (pts.length < 2) {
                svgWrap.innerHTML = `<div class="hist-empty">${pts.length === 0 ? 'No data yet' : 'Not enough data'}</div>`;
                if (statsEl) statsEl.innerHTML = '';
                return;
            }

            const W = 1000, H = 80;
            const tMin   = now - windowMs;
            const tRange = windowMs;
            const cx = e => (e.ts - tMin) / tRange * W;

            // pre-point for clean left edge
            const prePt = entries.filter(e => e.ts <= tMin).pop();
            const render = prePt ? [prePt, ...pts] : pts;

            // compute y scale across all series
            let vMin = Infinity, vMax = -Infinity;
            for (const s of series) {
                for (const e of render) {
                    const v = e[s.key];
                    if (v != null) { if (v < vMin) vMin = v; if (v > vMax) vMax = v; }
                }
            }
            if (vMin === vMax) { vMin -= 1; vMax += 1; }
            const cy = v => H - 4 - ((v - vMin) / (vMax - vMin)) * (H - 12);

            // build polylines
            let lines = '', areas = '';
            for (const s of series) {
                const valid = render.filter(e => e[s.key] != null);
                if (valid.length < 2) continue;
                const coords = valid.map(e => `${cx(e).toFixed(1)},${cy(e[s.key]).toFixed(1)}`).join(' ');
                const aCoords = `${cx(valid[0]).toFixed(1)},${H} ${coords} ${cx(valid[valid.length-1]).toFixed(1)},${H}`;
                lines += `<polyline points="${coords}" fill="none" stroke="${s.color}" stroke-width="2"
                    stroke-linejoin="round" stroke-linecap="round" pointer-events="none"/>`;
                areas += `<polygon points="${aCoords}" fill="${s.color}" fill-opacity="0.08" pointer-events="none"/>`;
            }

            const mainKey = series[0].key;
            const last    = pts[pts.length - 1][mainKey];
            const all     = pts.map(e => e[mainKey]).filter(v => v != null);
            const mn      = Math.min(...all), mx = Math.max(...all);

            // gradient id must be unique per section to avoid collisions
            const gid = `hg_${containerId}`;

            svgWrap.innerHTML = `
<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" style="cursor:crosshair">
  ${areas}${lines}
  <line id="${containerId}_ch" x1="0" y1="0" x2="0" y2="${H}" stroke="#444" stroke-width="1"
        stroke-dasharray="3,3" display="none" pointer-events="none"/>
  <circle id="${containerId}_dot" r="3.5" fill="${series[0].color}" display="none" pointer-events="none"/>
  <rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
</svg>
<div class="hist-tooltip" id="${containerId}_tip" style="display:none"></div>`;

            // ── hover ─────────────────────────────────────────────
            const svg  = svgWrap.querySelector('svg');
            const ch   = svgWrap.querySelector(`#${containerId}_ch`);
            const dot  = svgWrap.querySelector(`#${containerId}_dot`);
            const tip  = svgWrap.querySelector(`#${containerId}_tip`);

            function svgX(ev) {
                const pt = svg.createSVGPoint();
                pt.x = ev.clientX; pt.y = ev.clientY;
                return pt.matrixTransform(svg.getScreenCTM().inverse()).x;
            }
            function nearest(x) {
                let best = pts[0], bd = Infinity;
                for (const p of pts) {
                    const d = Math.abs(cx(p) - x);
                    if (d < bd) { bd = d; best = p; }
                }
                return best;
            }

            svg.addEventListener('mousemove', ev => {
                const p  = nearest(svgX(ev));
                const pv = p[mainKey];
                const px = cx(p), py = pv != null ? cy(pv) : H / 2;
                ch.setAttribute('x1', px); ch.setAttribute('x2', px);
                ch.removeAttribute('display');
                if (pv != null) {
                    dot.setAttribute('cx', px); dot.setAttribute('cy', py);
                    dot.removeAttribute('display');
                }
                const time = new Date(p.ts).toLocaleString('en-US',
                    {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
                tip.innerHTML = series.map(s =>
                    `<span style="color:${s.color}">●</span> <strong>${fmtVal(p[s.key])}</strong> ${s.label}`
                ).join('<br>') + `<br><span style="color:#555;font-size:11px">${time}</span>`;
                tip.style.display = 'block';
                const dotPt = svg.createSVGPoint();
                dotPt.x = px; dotPt.y = py;
                const sc   = dotPt.matrixTransform(svg.getScreenCTM());
                let left = sc.x - tip.offsetWidth / 2;
                let top  = sc.y - tip.offsetHeight - 8;
                left = Math.max(4, Math.min(left, window.innerWidth  - tip.offsetWidth  - 4));
                top  = Math.max(4, Math.min(top,  window.innerHeight - tip.offsetHeight - 4));
                if (top < sc.y - tip.offsetHeight - 4) top = sc.y + 12;
                tip.style.left = left + 'px';
                tip.style.top  = top  + 'px';
            });
            svg.addEventListener('mouseleave', () => {
                ch.setAttribute('display', 'none');
                dot.setAttribute('display', 'none');
                tip.style.display = 'none';
            });

            // ── summary stats ─────────────────────────────────────
            if (statsEl) {
                statsEl.innerHTML = `
                    <div class="hist-stat">
                        <span class="hist-stat-val">${fmtVal(last)}</span>
                        <span class="hist-stat-lbl">Current</span>
                    </div>
                    <div class="hist-stat">
                        <span class="hist-stat-val">${fmtVal(mx)}</span>
                        <span class="hist-stat-lbl">Peak (window)</span>
                    </div>
                    <div class="hist-stat">
                        <span class="hist-stat-val">${fmtVal(mn)}</span>
                        <span class="hist-stat-lbl">Low (window)</span>
                    </div>`;
            }
        }

        draw();
    }

    /* generateFlagSVG — used only as an instant CSS background pre-fill
       while the real /api/flag/... request is in flight on grid pages. */
    function generateFlagSVG(name) {
        const fontSize = name.length > 18 ? 10 : name.length > 12 ? 13 : 15;
        const label = name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').toUpperCase();
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <rect width="200" height="100" fill="#272727"/>
  <text x="100" y="50" font-family="Inter,Arial,sans-serif" font-size="${fontSize}" font-weight="600"
        fill="rgba(255,255,255,0.45)" text-anchor="middle" dominant-baseline="middle" letter-spacing="2">${label}</text>
</svg>`;
        return 'data:image/svg+xml,' + encodeURIComponent(svg);
    }
    </script>
    <script src="/assets/bust.js" defer></script>
</body>
</html>
