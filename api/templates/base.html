<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ViewPol{% endblock %}</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #111;
            color: #e8e8e8;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* ─── Navbar ─────────────────── */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 200;
            height: 54px;
            display: flex;
            align-items: center;
            padding: 0 28px;
            gap: 20px;
            background: rgba(13, 13, 13, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid #1e1e1e;
        }
        .navbar-brand {
            font-size: 17px;
            font-weight: 700;
            color: #f0f0f0 !important;
            text-decoration: none !important;
            letter-spacing: 0.2px;
            flex-shrink: 0;
        }
        .navbar-brand:hover { color: #4da6ff !important; }
        .navbar-divider {
            width: 1px;
            height: 18px;
            background: #2a2a2a;
            flex-shrink: 0;
        }
        .navbar-links {
            display: flex;
            align-items: center;
            gap: 4px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .navbar-links::-webkit-scrollbar { display: none; }
        .navbar-links a {
            color: #888 !important;
            text-decoration: none !important;
            font-size: 13.5px;
            font-weight: 500;
            padding: 5px 11px;
            border-radius: 7px;
            transition: color 0.15s, background 0.15s;
            white-space: nowrap;
        }
        .navbar-links a:hover {
            color: #e0e0e0 !important;
            background: #1c1c1c;
        }
        .nav-group {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .nav-group-label {
            font-size: 9.5px;
            font-weight: 700;
            color: #3a3a3a;
            text-transform: uppercase;
            letter-spacing: 1.3px;
            padding: 2px 6px 2px 3px;
            flex-shrink: 0;
            pointer-events: none;
            user-select: none;
        }

        /* ─── Page wrapper ───────────── */
        .page-wrapper {
            max-width: 1440px;
            margin: 0 auto;
            padding: 32px 28px 120px;
        }

        h1 {
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 24px;
            color: #f0f0f0;
        }

        /* ─── Back link ──────────────── */
        a.back-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #777 !important;
            text-decoration: none !important;
            font-size: 13px;
            font-weight: 500;
            padding: 5px 11px 5px 8px;
            border-radius: 7px;
            border: 1px solid #242424;
            background: #181818;
            margin-bottom: 22px;
            transition: all 0.15s;
        }
        a.back-link:hover {
            color: #ccc !important;
            border-color: #343434;
            background: #1e1e1e;
        }

        /* ─── Grids ──────────────────── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
        }
        .shopgrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 14px;
        }
        .nationgrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 2fr));
            gap: 14px;
        }

        /* ─── Cards ──────────────────── */
        .player-card {
            background: #181818;
            border: 1px solid #242424;
            padding: 16px;
            border-radius: 10px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.3);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
            cursor: pointer;
        }
        .player-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            border-color: #333;
        }
        .player-card img {
            width: 80px;
            height: 80px;
            margin-bottom: 2px;
        }

        /* ─── Links ──────────────────── */
        a {
            text-decoration: none;
            color: #4da6ff;
            font-weight: 500;
            font-size: 15px;
        }
        a:hover { color: #7dc0ff; }

        /* ─── Search bar ─────────────── */
        .search-bar {
            text-align: center;
            margin-bottom: 20px;
        }
        .search-bar form {
            display: inline-flex;
            gap: 8px;
            align-items: center;
        }
        .search-bar input {
            padding: 9px 13px;
            font-size: 13.5px;
            font-family: inherit;
            border-radius: 8px;
            border: 1px solid #272727;
            background: #181818;
            color: #e0e0e0;
            width: 280px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .search-bar input:focus {
            border-color: #3d7bd6;
            box-shadow: 0 0 0 3px rgba(61,123,214,0.14);
        }
        .search-bar input::placeholder { color: #555; }

        /* ─── Buttons ────────────────── */
        button {
            padding: 9px 16px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            font-size: 13.5px;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }
        button:hover { background: #3b82f6; }


        /* ─── Filters ────────────────── */
        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-group {
            display: flex;
            align-items: center;
            background: #161616;
            border: 1px solid #252525;
            border-radius: 9px;
            overflow: hidden;
            padding: 3px;
        }
        .filter-group input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }
        .filter-group label {
            display: block;
            padding: 6px 13px;
            margin: 0;
            font-size: 13px;
            font-weight: 500;
            color: #777;
            cursor: pointer;
            transition: all 0.15s;
            border-radius: 7px;
            white-space: nowrap;
        }
        .filter-group input[type="radio"]:checked + label {
            background: #2563eb;
            color: #fff;
        }
        .filter-group label:hover {
            background: #202020;
            color: #bbb;
        }

        @media (max-width: 768px) {
            .page-wrapper { padding: 20px 16px 120px; }
            .navbar { padding: 0 16px; gap: 10px; }
            .navbar-links a { padding: 5px 8px; font-size: 13px; }
            .nav-group-label { display: none; }
            .search-bar input { width: 220px; }
            .filters {
                flex-direction: column;
                gap: 10px;
                align-items: stretch;
            }
            .filter-group { justify-content: center; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">ViewPol</a>
        <div class="navbar-divider"></div>
        <div class="navbar-links">
            <div class="nav-group">
                <span class="nav-group-label">Political</span>
                <a href="/nations">🌍 Nations</a>
                <a href="/towns">🏘️ Towns</a>
                <a href="/players">👤 Players</a>
            </div>
            <div class="navbar-divider"></div>
            <div class="nav-group">
                <span class="nav-group-label">Economy</span>
                <a href="/shops">🏦 Shops</a>
                <a href="/malls">🏬 Malls</a>
                <a href="/items">📦 Items</a>
            </div>
            <div class="navbar-divider"></div>
            <div class="nav-group">
                <span class="nav-group-label">War</span>
                <a href="/sieges">⚔️ Sieges</a>
                <a href="/kitpvp">🗡️ KitPvP</a>
            </div>
        </div>
    </nav>
    <div class="page-wrapper">
        {% block content %}{% endblock %}
    </div>
    <script>
    /* Make entire card clickable — .player-card and .sg-group-card both
       contain an <a href> inside; clicking anywhere outside that link
       navigates to its href. Clicks on <a> / <button> children still work normally. */
    document.addEventListener('click', function (e) {
        const card = e.target.closest('.player-card, .sg-group-card');
        if (!card || e.target.closest('a, button')) return;
        const link = card.querySelector('a[href]');
        if (link) window.location.href = link.href;
    });

    /* generateFlagSVG — used only as an instant CSS background pre-fill
       while the real /api/flag/... request is in flight on grid pages. */
    function generateFlagSVG(name) {
        const fontSize = name.length > 18 ? 10 : name.length > 12 ? 13 : 15;
        const label = name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').toUpperCase();
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <rect width="200" height="100" fill="#272727"/>
  <text x="100" y="50" font-family="Inter,Arial,sans-serif" font-size="${fontSize}" font-weight="600"
        fill="rgba(255,255,255,0.45)" text-anchor="middle" dominant-baseline="middle" letter-spacing="2">${label}</text>
</svg>`;
        return 'data:image/svg+xml,' + encodeURIComponent(svg);
    }
    </script>
    <script src="/assets/bust.js" defer></script>
</body>
</html>
