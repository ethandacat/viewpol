{% extends "base.html" %}
{% block title %}Towns | ViewPol{% endblock %}

{% block content %}
<h1>Towns</h1>

<div class="search-bar" style="margin-bottom:20px;">
    <input type="text" id="search-input" placeholder="Search towns..." value="{{ query }}" style="width:280px;">
</div>

<div class="grid nationgrid" id="grid"></div>
<div id="sentinel" style="height:1px;margin-bottom:40px;"></div>

<div id="card-pool" style="display:none;">
    {% for t in players %}
    <div class="player-card" data-name="{{ t.name }}">
        <img fetchpriority="high"
             src="https://cdn.earthpol.com/towns/{{ t.name.replace(' ', '_') }}.png"
             data-flag-name="{{ t.name }}"
             alt="{{ t.name }} flag"
             onerror="this.onerror=null;this.src=generateFlagSVG(this.dataset.flagName)"
             style="width:100%;height:auto;max-height:180px;object-fit:contain;">
        <a href="/towns/{{ t.uuid }}" style="display:block;text-align:center;">{{ t.name }}</a>
    </div>
    {% endfor %}
</div>

<script>
(function() {
    const BATCH = 50;
    const grid     = document.getElementById('grid');
    const sentinel = document.getElementById('sentinel');
    const allCards = Array.from(document.getElementById('card-pool').children)
        .sort((a, b) => a.dataset.name.localeCompare(b.dataset.name));

    let pool = allCards, shown = 0;

    function showMore() {
        const next = pool.slice(shown, shown + BATCH);
        if (!next.length) return;
        const frag = document.createDocumentFragment();
        next.forEach(c => {
            const img = c.querySelector('img');
            if (img && !img.dataset.prefilled) {
                img.dataset.prefilled = '1';
            }
            frag.appendChild(c);
        });
        grid.appendChild(frag);
        shown += next.length;
    }

    const observer = new IntersectionObserver(
        e => { if (e[0].isIntersecting) showMore(); },
        { rootMargin: '400px' }
    );
    observer.observe(sentinel);

    document.getElementById('search-input').addEventListener('input', function() {
        const q = this.value.toLowerCase().trim();
        pool = q ? allCards.filter(c => c.dataset.name.toLowerCase().includes(q)) : allCards;
        grid.innerHTML = '';
        shown = 0;
        showMore();
    });

    showMore();
})();
</script>
{% endblock %}
