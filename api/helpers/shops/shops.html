{% extends "base.html" %}
{% block title %}Shops | ViewPol{% endblock %}

{% block content %}
<h1>Shops</h1>

<div class="search-bar" style="margin-bottom:16px;">
    <input type="text" id="shop-search" placeholder="Search shops..." value="{{ query }}" style="width:280px;">
</div>

<div class="filters">
    <div class="filter-group">
        <input type="radio" id="stock-hide" name="stock_filter" value="hide" {{ 'checked' if stock_filter == 'hide' }}>
        <label for="stock-hide">Hide out of stock</label>
        <input type="radio" id="stock-show" name="stock_filter" value="show" {{ 'checked' if stock_filter == 'show' }}>
        <label for="stock-show">Show out of stock</label>
    </div>
    <div class="filter-group">
        <input type="radio" id="type-buying"  name="type_filter" value="buying"  {{ 'checked' if type_filter == 'buying' }}>
        <label for="type-buying">Buying</label>
        <input type="radio" id="type-both"    name="type_filter" value="both"    {{ 'checked' if type_filter == 'both' }}>
        <label for="type-both">Both</label>
        <input type="radio" id="type-selling" name="type_filter" value="selling" {{ 'checked' if type_filter == 'selling' }}>
        <label for="type-selling">Selling</label>
    </div>
</div>

<div class="grid shopgrid" id="shop-grid"></div>
<div id="sentinel" style="height:1px;margin-bottom:40px;"></div>

<script>
let shopQuery   = {{ query|tojson }};
let stockFilter = {{ stock_filter|tojson }};
let typeFilter  = {{ type_filter|tojson }};
let shopPage    = 0;
let shopLoading = false;
let shopHasMore = true;

const grid     = document.getElementById('shop-grid');
const sentinel = document.getElementById('sentinel');

const observer = new IntersectionObserver(
    e => { if (e[0].isIntersecting) loadMore(); },
    { rootMargin: '1200px' }
);
observer.observe(sentinel);

async function loadMore() {
    if (shopLoading || !shopHasMore) return;
    shopLoading = true;
    shopPage++;
    const params = new URLSearchParams({ page: shopPage, q: shopQuery, stock_filter: stockFilter, type_filter: typeFilter });
    const data   = await fetch('/shops/data?' + params).then(r => r.json());
    const frag   = document.createDocumentFragment();
    data.players.forEach(n => frag.appendChild(createCard(n)));
    grid.appendChild(frag);
    shopHasMore = data.has_more;
    shopLoading = false;
}

async function reset() {
    shopPage    = 0;
    shopHasMore = true;
    grid.innerHTML = '';
    await loadMore();
}

function titleCase(str) {
    return str.toLowerCase().replace(/\w\S*/g, t => t[0].toUpperCase() + t.slice(1));
}

function renderStockSpace(n) {
    if (n.type === 'SELLING') return n.stock <= 0 ? 'Out of stock.' : 'Stock: ' + n.stock;
    return n.space <= 0 ? 'Out of space.' : 'Space: ' + n.space;
}

function renderMeta(n) {
    if (!n.item || !n.item.meta) return '';
    const meta = n.item.meta;
    const parts = [];
    const enchants = Object.assign({}, meta.enchants || {}, meta['stored-enchants'] || {});
    const keys = Object.keys(enchants);
    if (keys.length) {
        parts.push(keys.map(k => k.replace('minecraft:', '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) + ' ' + enchants[k]).join(', '));
    }
    return parts.join('<br>');
}

function createCard(n) {
    const itemId     = (n.item && n.item.item || 'unknown').toLowerCase();
    const meta       = n.item && n.item.meta;
    let rawName = null;
    if (meta && meta['display-name'] && meta['display-name'].extra && meta['display-name'].extra[0]) {
        rawName = meta['display-name'].extra[0].text;
    }
    const displayName = titleCase(rawName || itemId.replace(/_/g, ' '));
    const card = document.createElement('div');
    card.className = 'player-card';
    card.style.cssText = 'padding:20px;box-sizing:border-box;';
    card.innerHTML = `
        <a href="/shops/${n.id}" style="color:white;line-height:1.2;font-weight:normal;">
            <img loading="lazy" fetchpriority="low" src="https://api.earthpol.com/textures/item/${itemId}.png"
                 style="width:80px;height:auto;max-height:180px;object-fit:contain;image-rendering:pixelated;"
                 onerror="this.style.display='none'">
            <p><b>${displayName}</b></p>
            <p><i>${n.type[0] + n.type.slice(1).toLowerCase()} for</i><br>${Math.round(n.price)}g per ${n.item.amount} items</p>
            <p>${renderStockSpace(n)}</p>
            <p style="font-size:.75rem;color:lightgray;font-style:italic;line-height:1.1;">${renderMeta(n)}</p>
        </a>`;
    return card;
}

document.getElementById('shop-search').addEventListener('input', function() {
    shopQuery = this.value.toLowerCase();
    reset();
});

document.querySelectorAll('input[name="stock_filter"]').forEach(r =>
    r.addEventListener('change', e => { stockFilter = e.target.value; reset(); })
);
document.querySelectorAll('input[name="type_filter"]').forEach(r =>
    r.addEventListener('change', e => { typeFilter = e.target.value; reset(); })
);

reset();
</script>
{% endblock %}
