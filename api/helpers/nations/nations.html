{% extends "base.html" %}
{% block title %}Nations | ViewPol{% endblock %}

{% block content %}
<h1>Nations</h1>

<div class="search-bar">
    <form id="search-form">
        <input type="text" id="search-input" placeholder="Search nations..." value="{{ query }}">
        <button type="submit">Search</button>
    </form>
</div>

<div id="nation-grid-container">
    <div class="grid nationgrid" style="visibility: hidden;">
        {% for n in players %}
        <div class="player-card" data-name="{{ n.name }}">
            <img loading="lazy"
                 src="https://cdn.earthpol.com/nations/{{ n.name.replace(' ', '_') }}.png"
                 alt="{{ n.name }} flag"
                 style="width: 100%; height: auto; max-height: 180px; object-fit: contain;"
                 onerror="this.onerror=null;this.src=generateFlagSVG(this.closest('[data-name]').dataset.name);">
            <a href="/nations/{{ n.uuid }}" style="display: block; text-align: center;">{{ n.name }}</a>
        </div>
        {% endfor %}
    </div>
</div>

<div class="pagination" id="pagination-controls"></div>

<script>
const NATIONS_PER_PAGE = 20;
let currentPage = {{ page }};

document.addEventListener('DOMContentLoaded', () => {
    const gridContainer = document.querySelector('.nationgrid');
    const allCards = Array.from(document.querySelectorAll('.player-card'));

    let nations = allCards
        .map(card => ({ name: card.dataset.name, element: card }))
        .sort((a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));

    const totalPages = Math.ceil(nations.length / NATIONS_PER_PAGE);

    function renderPage(page) {
        const start = (page - 1) * NATIONS_PER_PAGE;
        const end = start + NATIONS_PER_PAGE;
        gridContainer.innerHTML = '';
        nations.slice(start, end).forEach(n => gridContainer.appendChild(n.element));
        renderPaginationControls(page);
    }

    function renderPaginationControls(page) {
        const container = document.getElementById('pagination-controls');
        container.innerHTML = '';
        const controls = [];

        const first = document.createElement('a');
        first.href = '#'; first.textContent = '« First';
        first.className = page === 1 ? 'disabled' : '';
        if (page !== 1) first.onclick = e => { e.preventDefault(); goToPage(1); };
        controls.push(first);

        const prev = document.createElement('a');
        prev.href = '#'; prev.textContent = '‹ Prev';
        prev.className = page === 1 ? 'disabled' : '';
        if (page > 1) prev.onclick = e => { e.preventDefault(); goToPage(page - 1); };
        controls.push(prev);

        const startNum = Math.max(1, Math.min(totalPages - 2, page - 1));
        for (let i = 0; i < 3; i++) {
            const numPage = startNum + i;
            if (numPage <= totalPages) {
                const pageLink = document.createElement('a');
                pageLink.href = '#'; pageLink.textContent = numPage;
                if (numPage === page) pageLink.className = 'current';
                pageLink.onclick = e => { e.preventDefault(); goToPage(numPage); };
                controls.push(pageLink);
            } else {
                const filler = document.createElement('span');
                filler.textContent = '...'; filler.className = 'filler';
                controls.push(filler);
            }
        }

        const next = document.createElement('a');
        next.href = '#'; next.textContent = 'Next ›';
        next.className = page === totalPages ? 'disabled' : '';
        if (page < totalPages) next.onclick = e => { e.preventDefault(); goToPage(page + 1); };
        controls.push(next);

        const last = document.createElement('a');
        last.href = '#'; last.textContent = 'Last »';
        last.className = page === totalPages ? 'disabled' : '';
        if (page !== totalPages) last.onclick = e => { e.preventDefault(); goToPage(totalPages); };
        controls.push(last);

        controls.forEach(c => container.appendChild(c));
    }

    function goToPage(page) {
        currentPage = page;
        renderPage(currentPage);
    }

    document.getElementById('search-form').addEventListener('submit', e => {
        e.preventDefault();
        const query = document.getElementById('search-input').value.toLowerCase();
        nations = allCards
            .filter(card => card.dataset.name.toLowerCase().includes(query))
            .map(card => ({ name: card.dataset.name, element: card }))
            .sort((a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
        currentPage = 1;
        renderPage(currentPage);
    });

    renderPage(currentPage);
    gridContainer.style.visibility = 'visible';
});
</script>

{% endblock %}
