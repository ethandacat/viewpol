{% extends "base.html" %}
{% block title %}Nations | ViewPol{% endblock %}

{% block content %}
<h1>Nations</h1>

<div class="search-bar">
    <form id="search-form">
        <input type="text" id="search-input" placeholder="Search nations..." value="{{ query }}">
        <button type="submit">Search</button>
    </form>
</div>

<div class="grid nationgrid" style="visibility: hidden;">
    {% for n in players %}
    <div class="player-card" data-name="{{ n.name }}">
        <img loading="lazy"
             src="https://cdn.earthpol.com/nations/{{ n.name.replace(' ', '_') }}.png"
             alt="{{ n.name }} flag"
             style="width: 100%; height: auto; max-height: 180px; object-fit: contain;"
             onerror="this.onerror=null;this.src=generateFlagSVG(this.closest('[data-name]').dataset.name);">
        <a href="/nations/{{ n.uuid }}" style="display: block; text-align: center;">{{ n.name }}</a>
    </div>
    {% endfor %}
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const grid = document.querySelector('.nationgrid');
    const allCards = Array.from(grid.querySelectorAll('.player-card'));

    function render(cards) {
        grid.innerHTML = '';
        cards
            .sort((a, b) => a.dataset.name.toLowerCase().localeCompare(b.dataset.name.toLowerCase()))
            .forEach(c => grid.appendChild(c));
    }

    document.getElementById('search-form').addEventListener('submit', e => {
        e.preventDefault();
        const q = document.getElementById('search-input').value.toLowerCase();
        render(allCards.filter(c => c.dataset.name.toLowerCase().includes(q)));
    });

    render(allCards);
    grid.style.visibility = 'visible';
});
</script>

{% endblock %}
