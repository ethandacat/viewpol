{% extends "base.html" %}
{% block title %}Players | ViewPol{% endblock %}

{% block content %}
<h1>Players</h1>

<div class="search-bar" style="margin-bottom:20px;">
    <input type="text" id="search-input" placeholder="Search players..." value="{{ query }}" style="width:280px;">
</div>

<div class="grid" id="grid"></div>
<div id="sentinel" style="height:1px;margin-bottom:40px;"></div>

<div id="card-pool" style="display:none;">
    {% for p in players %}
    <div class="player-card" data-name="{{ p.name }}">
        <img loading="lazy"
             src="https://api.mineatar.io/head/{{ p.uuid }}?scale=15&overlay=true&format=png"
             alt="{{ p.name }}'s head">
        <a href="/players/{{ p.uuid }}">{{ p.name }}</a>
    </div>
    {% endfor %}
</div>

<script>
(function() {
    const BATCH = 50;
    const grid     = document.getElementById('grid');
    const sentinel = document.getElementById('sentinel');
    const allCards = Array.from(document.getElementById('card-pool').children)
        .sort((a, b) => a.dataset.name.localeCompare(b.dataset.name));

    let pool = allCards, shown = 0;

    function showMore() {
        const next = pool.slice(shown, shown + BATCH);
        if (!next.length) return;
        const frag = document.createDocumentFragment();
        next.forEach(c => frag.appendChild(c));
        grid.appendChild(frag);
        shown += next.length;
    }

    const observer = new IntersectionObserver(
        e => { if (e[0].isIntersecting) showMore(); },
        { rootMargin: '400px' }
    );
    observer.observe(sentinel);

    document.getElementById('search-input').addEventListener('input', function() {
        const q = this.value.toLowerCase().trim();
        pool = q ? allCards.filter(c => c.dataset.name.toLowerCase().includes(q)) : allCards;
        grid.innerHTML = '';
        shown = 0;
        showMore();
    });

    showMore();
})();
</script>
{% endblock %}
