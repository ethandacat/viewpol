{% extends "base.html" %}
{% block title %}Players | ViewPol{% endblock %}

{% block content %}
<h1>Players</h1>

<div class="search-bar">
    <form id="search-form">
        <input type="text" id="search-input" placeholder="Search players..." value="{{ query }}">
        <button type="submit">Search</button>
    </form>
</div>

<div class="grid" style="visibility: hidden;" id="player-grid">
    {% for p in players %}
    <div class="player-card" data-name="{{ p.name }}">
        <canvas class="head-canvas" data-skin="/skin/{{ p.name }}" width="80" height="80"></canvas>
        <a href="/players/{{ p.uuid }}">{{ p.name }}</a>
    </div>
    {% endfor %}
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const grid = document.getElementById('player-grid');
    const allCards = Array.from(grid.querySelectorAll('.player-card'));

    function render(cards) {
        grid.innerHTML = '';
        cards
            .sort((a, b) => a.dataset.name.toLowerCase().localeCompare(b.dataset.name.toLowerCase()))
            .forEach(c => grid.appendChild(c));
    }

    document.getElementById('search-form').addEventListener('submit', e => {
        e.preventDefault();
        const q = document.getElementById('search-input').value.toLowerCase();
        render(allCards.filter(c => c.dataset.name.toLowerCase().includes(q)));
    });

    render(allCards);
    grid.style.visibility = 'visible';
});
</script>

{% endblock %}
