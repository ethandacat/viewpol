{% extends "base.html" %}
{% block title %}KitPvP Leaderboard | ViewPol{% endblock %}

{% block content %}
<h1>KitPvP Leaderboard</h1>

<div class="lb-wrap">
<table class="lb-table">
    <thead>
        <tr>
            <th class="col-rank">#</th>
            <th class="col-player">Player</th>
            <th class="col-num" data-col="kills">Kills <span class="sort-arrow">↓</span></th>
            <th class="col-num" data-col="deaths">Deaths <span class="sort-arrow">↕</span></th>
            <th class="col-num" data-col="kd">K/D <span class="sort-arrow">↕</span></th>
            <th class="col-num" data-col="assists">Assists <span class="sort-arrow">↕</span></th>
            <th class="col-num" data-col="best_killstreak">Best Streak <span class="sort-arrow">↕</span></th>
            <th class="col-num" data-col="damage">Damage <span class="sort-arrow">↕</span></th>
        </tr>
    </thead>
    <tbody id="lb-body">
        <tr><td colspan="8" class="loading-cell">Loading...</td></tr>
    </tbody>
</table>
</div>

<div class="pagination" id="lb-pagination" style="display:none;">
    <a id="btn-prev" class="disabled">← Prev</a>
    <span class="filler" id="page-label">Page 1</span>
    <a id="btn-next" class="disabled">Next →</a>
</div>

<style>
.lb-wrap { overflow-x: auto; }
.lb-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
}
.lb-table thead th {
    padding: 9px 14px;
    font-size: 11px;
    font-weight: 600;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid #222;
    white-space: nowrap;
    text-align: left;
    user-select: none;
    transition: color 0.15s;
}
.lb-table thead th.col-num {
    text-align: right;
    cursor: pointer;
}
.lb-table thead th.col-num:hover { color: #aaa; }
.lb-table thead th.active { color: #4da6ff; }
.sort-arrow { margin-left: 4px; opacity: 0.4; font-size: 10px; }
.lb-table thead th.active .sort-arrow { opacity: 1; }

.lb-table tbody tr {
    border-bottom: 1px solid #1a1a1a;
    transition: background 0.12s;
}
.lb-table tbody tr:hover { background: #161616; }
.lb-table tbody tr.top-1 { background: rgba(255,215,0,0.04); }
.lb-table tbody tr.top-2 { background: rgba(192,192,192,0.04); }
.lb-table tbody tr.top-3 { background: rgba(205,127,50,0.04); }

.lb-table td {
    padding: 9px 14px;
    color: #bbb;
    white-space: nowrap;
    vertical-align: middle;
}
.loading-cell { text-align: center; color: #555; font-style: italic; padding: 40px; }
.col-rank { color: #555; font-size: 13px; width: 44px; text-align: center; }
.col-player { min-width: 160px; }
.col-player a { color: #e0e0e0 !important; font-size: 13.5px; font-weight: 500; }
.col-player a:hover { color: #4da6ff !important; }
.col-num { text-align: right; font-variant-numeric: tabular-nums; }
.active-col { color: #e0e0e0; font-weight: 600; }
.lb-head { width: 20px; height: 20px; border-radius: 3px; image-rendering: pixelated; vertical-align: middle; margin-right: 8px; }
</style>

<script>
const PER_PAGE = 50;
let allPlayers = [];
let sortCol    = 'kills';
let sortDesc   = true;
let page       = 1;

const body     = document.getElementById('lb-body');
const pag      = document.getElementById('lb-pagination');
const pageLabel = document.getElementById('page-label');
const btnPrev  = document.getElementById('btn-prev');
const btnNext  = document.getElementById('btn-next');

fetch('/kitpvp/data')
    .then(r => r.json())
    .then(data => {
        allPlayers = data;
        render();
        pag.style.display = '';
    });

document.querySelectorAll('th[data-col]').forEach(th => {
    th.addEventListener('click', () => {
        const col = th.dataset.col;
        if (sortCol === col) {
            sortDesc = !sortDesc;
        } else {
            sortCol  = col;
            sortDesc = true;
        }
        page = 1;
        render();
    });
});

btnPrev.addEventListener('click', () => { if (page > 1) { page--; render(); } });
btnNext.addEventListener('click', () => { if (hasNext()) { page++; render(); } });

function hasNext() {
    return page * PER_PAGE < allPlayers.length;
}

function render() {
    const sorted = [...allPlayers].sort((a, b) => {
        const av = a[sortCol] ?? 0, bv = b[sortCol] ?? 0;
        return sortDesc ? bv - av : av - bv;
    });

    const offset = (page - 1) * PER_PAGE;
    const slice  = sorted.slice(offset, offset + PER_PAGE);

    const medals = ['🥇','🥈','🥉'];
    const rows = slice.map((p, i) => {
        const rank    = offset + i + 1;
        const rankStr = rank <= 3 ? medals[rank-1] : rank;
        const cls     = rank <= 3 ? `top-${rank}` : '';
        return `<tr class="${cls}">
            <td class="col-rank">${rankStr}</td>
            <td class="col-player">
                <img src="https://mc-heads.net/avatar/${p.uuid}/20" class="lb-head" onerror="this.style.display='none'">
                <a href="/players/${p.username}">${p.username}</a>
            </td>
            <td class="col-num${sortCol==='kills'?' active-col':''}">${p.kills}</td>
            <td class="col-num${sortCol==='deaths'?' active-col':''}">${p.deaths}</td>
            <td class="col-num${sortCol==='kd'?' active-col':''}">${p.kd}</td>
            <td class="col-num${sortCol==='assists'?' active-col':''}">${p.assists}</td>
            <td class="col-num${sortCol==='best_killstreak'?' active-col':''}">${p.best_killstreak}</td>
            <td class="col-num${sortCol==='damage'?' active-col':''}">${Math.floor(p.damage).toLocaleString()}</td>
        </tr>`;
    });
    body.innerHTML = rows.join('');

    document.querySelectorAll('th[data-col]').forEach(th => {
        const isActive = th.dataset.col === sortCol;
        th.classList.toggle('active', isActive);
        th.querySelector('.sort-arrow').textContent = isActive ? (sortDesc ? '↓' : '↑') : '↕';
    });

    pageLabel.textContent = `Page ${page}`;
    btnPrev.classList.toggle('disabled', page === 1);
    btnNext.classList.toggle('disabled', !hasNext());
    btnPrev.style.pointerEvents = page === 1 ? 'none' : '';
    btnNext.style.pointerEvents = !hasNext() ? 'none' : '';
}
</script>
{% endblock %}
