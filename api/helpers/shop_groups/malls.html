{% extends "base.html" %}
{% block title %}Malls | ViewPol{% endblock %}

{% block content %}
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
    <h1 style="margin:0;">Malls</h1>
    <button id="create-btn" class="sg-btn-primary">+ New Mall</button>
</div>

<div id="groups-loading" style="color:#555;font-style:italic;">Loading…</div>
<div id="groups-grid" class="groups-grid" style="display:none;"></div>
<div id="no-groups" style="display:none;text-align:center;color:#555;font-style:italic;padding:60px 0;">
    No malls yet. Create one to start comparing shop prices!
</div>

<!-- Create modal -->
<div id="modal" class="sg-modal-overlay" style="display:none;">
    <div class="sg-modal-box">

        <!-- Step 1: Name -->
        <div id="step-1">
            <div class="sg-modal-header">
                <h2>New Mall</h2>
                <button class="sg-modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="sg-modal-body">
                <label class="sg-label">Mall Name</label>
                <input id="group-name-input" class="sg-input" placeholder="e.g. Spawn Market, Walmart District" maxlength="60">
            </div>
            <div class="sg-modal-footer">
                <button class="sg-btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="sg-btn-primary" id="step1-next">Next →</button>
            </div>
        </div>

        <!-- Step 2: Add shops -->
        <div id="step-2" style="display:none;">
            <div class="sg-modal-header">
                <h2 id="step2-title">Add Shops</h2>
                <button class="sg-modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="sg-modal-body">
                <div class="sg-tab-row">
                    <button class="sg-tab active" data-tab="manual">🔍 Manual</button>
                    <button class="sg-tab" data-tab="area">📍 Area</button>
                    <button class="sg-tab" data-tab="user">👤 User</button>
                </div>

                <!-- Manual -->
                <div id="tab-manual" class="sg-tab-pane">
                    <input id="manual-q" class="sg-input" placeholder="Search by item name…" style="margin-bottom:10px;">
                    <div id="manual-results" class="sg-pick-list"></div>
                </div>

                <!-- Area -->
                <div id="tab-area" class="sg-tab-pane" style="display:none;">
                    <div class="sg-coord-row">
                        <input id="ax1" class="sg-input sg-coord" type="number" placeholder="X min">
                        <input id="az1" class="sg-input sg-coord" type="number" placeholder="Z min">
                        <span class="sg-coord-arrow">→</span>
                        <input id="ax2" class="sg-input sg-coord" type="number" placeholder="X max">
                        <input id="az2" class="sg-input sg-coord" type="number" placeholder="Z max">
                    </div>
                    <button id="area-search-btn" class="sg-btn-secondary" style="margin-top:8px;">Find Shops</button>
                    <div id="area-status" style="font-size:12px;color:#666;margin-top:8px;min-height:16px;"></div>
                    <div id="area-results" class="sg-pick-list" style="margin-top:4px;"></div>
                </div>

                <!-- User -->
                <div id="tab-user" class="sg-tab-pane" style="display:none;">
                    <div style="display:flex;gap:8px;margin-bottom:8px;">
                        <input id="user-q" class="sg-input" placeholder="Player name or UUID…" style="flex:1;">
                        <button id="user-search-btn" class="sg-btn-secondary">Find Shops</button>
                    </div>
                    <div id="user-status" style="font-size:12px;color:#666;margin-bottom:8px;min-height:16px;"></div>
                    <div id="user-results" class="sg-pick-list"></div>
                </div>

                <div id="selected-bar">
                    <span id="selected-count">0</span> shops selected
                    <button class="sg-btn-ghost" id="clear-selected" style="margin-left:8px;">Clear</button>
                </div>
            </div>
            <div class="sg-modal-footer">
                <button class="sg-btn-secondary" id="step2-back">← Back</button>
                <button class="sg-btn-primary" id="step2-create">Create Mall</button>
            </div>
        </div>

    </div>
</div>

<style>
.groups-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.sg-group-card { background: #181818; border: 1px solid #252525; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; transition: border-color 0.15s, transform 0.15s; }
.sg-group-card:hover { border-color: #333; transform: translateY(-2px); }
.sg-group-card.mine { border-color: #1e3a5f55; }
.sg-group-name { font-size: 16px; font-weight: 700; color: #f0f0f0; }
.sg-group-meta { font-size: 12px; color: #555; }
.sg-group-actions { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.sg-owner-badge { font-size: 10px; font-weight: 600; color: #60a5fa; background: rgba(37,99,235,0.1); border: 1px solid rgba(37,99,235,0.25); border-radius: 6px; padding: 1px 7px; align-self: flex-start; }

.sg-btn-primary { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer; }
.sg-btn-primary:hover { background: #1d4ed8; }
.sg-btn-primary:disabled { opacity: 0.5; cursor: default; }
.sg-btn-secondary { background: #252525; color: #ccc; border: 1px solid #333; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 500; cursor: pointer; }
.sg-btn-secondary:hover { background: #2a2a2a; }
.sg-btn-ghost { background: none; color: #555; border: none; font-size: 12px; cursor: pointer; padding: 2px 6px; }
.sg-btn-ghost:hover { color: #aaa; }
.sg-btn-danger { background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.25); border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
.sg-btn-danger:hover { background: rgba(239,68,68,0.2); }
.sg-btn-view { background: #1e293b; color: #60a5fa; border: 1px solid #1e3a5f; border-radius: 8px; padding: 6px 12px; font-size: 12px; text-decoration: none; font-weight: 500; }
.sg-btn-view:hover { background: #1e3a5f; color: #93c5fd; }

.sg-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.sg-modal-box { background: #161616; border: 1px solid #2a2a2a; border-radius: 14px; width: min(580px, 95vw); max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
.sg-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 0; flex-shrink: 0; }
.sg-modal-header h2 { margin: 0; font-size: 18px; font-weight: 700; }
.sg-modal-close { background: none; border: none; color: #555; font-size: 18px; cursor: pointer; padding: 2px 6px; line-height: 1; }
.sg-modal-close:hover { color: #aaa; }
.sg-modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; min-height: 0; }
.sg-modal-footer { padding: 14px 20px; display: flex; justify-content: space-between; border-top: 1px solid #252525; flex-shrink: 0; }

.sg-label { font-size: 11px; color: #666; display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.sg-input { width: 100%; box-sizing: border-box; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; color: #e0e0e0; font-size: 14px; padding: 8px 12px; outline: none; transition: border-color 0.15s; }
.sg-input:focus { border-color: #2563eb; }

.sg-tab-row { display: flex; gap: 8px; margin-bottom: 14px; }
.sg-tab { background: #1a1a1a; border: 1px solid #252525; border-radius: 8px; color: #777; padding: 7px 16px; font-size: 13px; cursor: pointer; }
.sg-tab.active { background: #1e293b; border-color: #1e3a5f; color: #60a5fa; }

.sg-pick-list { display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow-y: auto; }
.sg-pick-item { display: flex; align-items: center; gap: 10px; background: #1a1a1a; border: 1px solid #252525; border-radius: 8px; padding: 8px 10px; cursor: pointer; transition: border-color 0.15s; }
.sg-pick-item:hover { border-color: #333; }
.sg-pick-item.selected { border-color: #2563eb55; background: #1e293b; }
.sg-pick-img { width: 32px; height: 32px; image-rendering: pixelated; object-fit: contain; flex-shrink: 0; }
.sg-pick-info { flex: 1; min-width: 0; }
.sg-pick-name { font-size: 13px; font-weight: 600; color: #e0e0e0; }
.sg-pick-sub  { font-size: 11px; color: #555; }
.sg-pick-price { font-size: 13px; font-weight: 600; color: #aaa; flex-shrink: 0; }

.sg-coord-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sg-coord { width: 90px !important; }
.sg-coord-arrow { color: #444; font-size: 16px; }

#selected-bar { margin-top: 14px; padding: 8px 12px; background: #1a1a1a; border: 1px solid #252525; border-radius: 8px; font-size: 13px; color: #aaa; display: flex; align-items: center; }
#selected-count { font-weight: 700; color: #60a5fa; }
</style>

<script>
const TOKEN_PREFIX = 'mall_tok_';

function getToken(id)    { return localStorage.getItem(TOKEN_PREFIX + id) || null; }
function setToken(id, t) { localStorage.setItem(TOKEN_PREFIX + id, t); }
function clearToken(id)  { localStorage.removeItem(TOKEN_PREFIX + id); }

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtAgo(ms) {
    const s = (Date.now() - ms) / 1000;
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s/60) + 'm ago';
    if (s < 86400) return Math.floor(s/3600) + 'h ago';
    return Math.floor(s/86400) + 'd ago';
}
function titleCase(s) { return s.toLowerCase().replace(/\w\S*/g, t => t[0].toUpperCase() + t.slice(1)); }
function getDisplayName(shop) {
    const itemId = (shop.item?.item || 'unknown').toLowerCase();
    const extra = shop.item?.meta?.['display-name']?.extra;
    return titleCase((extra?.[0]?.text) || itemId.replace(/_/g, ' '));
}
function fmtUnitPrice(shop) {
    const up = shop.unit_price;
    return (up && isFinite(up) && up > 0) ? (Math.round(up * 100) / 100) + 'g/ea' : Math.round(shop.price) + 'g';
}

// ── Malls list ─────────────────────────────────────────────────────
async function loadGroups() {
    const groups = await fetch('/malls/api/groups').then(r => r.json());
    document.getElementById('groups-loading').style.display = 'none';
    const grid = document.getElementById('groups-grid');
    const none = document.getElementById('no-groups');
    if (!groups.length) { none.style.display = 'block'; return; }
    grid.style.display = '';
    grid.innerHTML = '';
    groups.forEach(g => {
        const mine = !!getToken(g.id);
        const card = document.createElement('div');
        card.className = 'sg-group-card' + (mine ? ' mine' : '');
        card.innerHTML = `
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
                <div class="sg-group-name">🏬 ${esc(g.name)}</div>
                ${mine ? '<span class="sg-owner-badge">✏ Yours</span>' : ''}
            </div>
            <div class="sg-group-meta">${g.shopIds.length} shop${g.shopIds.length !== 1 ? 's' : ''} · ${fmtAgo(g.createdAt)}</div>
            <div class="sg-group-actions">
                <a href="/malls/${g.id}" class="sg-btn-view">View →</a>
                ${mine ? `<button class="sg-btn-danger" onclick="deleteMall('${g.id}', this)">Delete</button>` : ''}
            </div>`;
        grid.appendChild(card);
    });
}

async function deleteMall(id, btn) {
    const token = getToken(id);
    if (!token || !confirm('Delete this mall?')) return;
    btn.disabled = true;
    const res = await fetch('/malls/api/groups/' + id, {
        method: 'DELETE',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ editToken: token }),
    });
    if (res.ok) { clearToken(id); loadGroups(); }
    else { btn.disabled = false; alert('Could not delete mall.'); }
}

// ── Modal ──────────────────────────────────────────────────────────
let pendingName = '';
let selectedIds = new Set();
let manualShops = [], areaShops = [], userShops = [];

function openModal() {
    pendingName = ''; selectedIds = new Set();
    manualShops = []; areaShops = []; userShops = [];
    document.getElementById('group-name-input').value = '';
    document.getElementById('manual-q').value = '';
    document.getElementById('user-q').value = '';
    ['manual-results','area-results','user-results'].forEach(id => document.getElementById(id).innerHTML = '');
    document.getElementById('area-status').textContent = '';
    document.getElementById('user-status').textContent = '';
    // Reset tabs to Manual
    document.querySelectorAll('.sg-tab').forEach(b => b.classList.remove('active'));
    document.querySelector('.sg-tab[data-tab="manual"]').classList.add('active');
    document.getElementById('tab-manual').style.display = '';
    document.getElementById('tab-area').style.display = 'none';
    document.getElementById('tab-user').style.display = 'none';
    showStep(1);
    document.getElementById('modal').style.display = 'flex';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; }
function showStep(n) {
    document.getElementById('step-1').style.display = n === 1 ? '' : 'none';
    document.getElementById('step-2').style.display = n === 2 ? '' : 'none';
}
function updateBar() { document.getElementById('selected-count').textContent = selectedIds.size; }

function toggleShop(id) {
    if (selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
    updateBar();
    renderPicks('manual-results', manualShops);
    renderPicks('area-results', areaShops);
    renderPicks('user-results', userShops);
}

function renderPicks(containerId, shops) {
    const el = document.getElementById(containerId);
    el.innerHTML = '';
    shops.forEach(s => {
        const itemId = (s.item?.item || 'unknown').toLowerCase();
        const name = getDisplayName(s);
        const loc = s.location ? `${Math.round(s.location.x)}, ${Math.round(s.location.z)}` : '';
        const div = document.createElement('div');
        div.className = 'sg-pick-item' + (selectedIds.has(s.id) ? ' selected' : '');
        div.innerHTML = `
            <img class="sg-pick-img" src="https://api.earthpol.com/textures/item/${esc(itemId)}.png" onerror="this.style.display='none'" alt="">
            <div class="sg-pick-info">
                <div class="sg-pick-name">${esc(name)}</div>
                <div class="sg-pick-sub">${s.type === 'SELLING' ? 'Selling' : 'Buying'}${loc ? ' · ' + loc : ''}</div>
            </div>
            <div class="sg-pick-price">${fmtUnitPrice(s)}</div>`;
        div.addEventListener('click', () => toggleShop(s.id));
        el.appendChild(div);
    });
}

// Tabs
document.querySelectorAll('.sg-tab').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.sg-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.getElementById('tab-manual').style.display = tab === 'manual' ? '' : 'none';
        document.getElementById('tab-area').style.display   = tab === 'area'   ? '' : 'none';
        document.getElementById('tab-user').style.display   = tab === 'user'   ? '' : 'none';
    });
});

// Manual search
let manualTimer = null;
document.getElementById('manual-q').addEventListener('input', function() {
    clearTimeout(manualTimer);
    const q = this.value.trim();
    if (!q) { manualShops = []; renderPicks('manual-results', []); return; }
    manualTimer = setTimeout(async () => {
        const res = await fetch(`/shops/data?q=${encodeURIComponent(q.toLowerCase())}&page=1&stock_filter=show&type_filter=both`).then(r => r.json());
        manualShops = res.players || [];
        renderPicks('manual-results', manualShops);
    }, 300);
});

// Area search
document.getElementById('area-search-btn').addEventListener('click', async () => {
    const x1 = document.getElementById('ax1').value, z1 = document.getElementById('az1').value;
    const x2 = document.getElementById('ax2').value, z2 = document.getElementById('az2').value;
    if (!x1 || !z1 || !x2 || !z2) { document.getElementById('area-status').textContent = 'Fill in all four coordinate fields.'; return; }
    document.getElementById('area-status').textContent = 'Searching…';
    const res = await fetch('/malls/api/area?' + new URLSearchParams({x1,z1,x2,z2})).then(r => r.json());
    areaShops = Array.isArray(res) ? res : [];
    document.getElementById('area-status').textContent = areaShops.length
        ? areaShops.length + ' shops found.'
        : 'No shops found in this area.';
    renderPicks('area-results', areaShops);
});

// User search
document.getElementById('user-search-btn').addEventListener('click', async () => {
    const q = document.getElementById('user-q').value.trim();
    if (!q) return;
    document.getElementById('user-status').textContent = 'Searching…';
    document.getElementById('user-results').innerHTML = '';
    const res = await fetch('/malls/api/user-shops?user=' + encodeURIComponent(q)).then(r => r.json());
    if (res.error) {
        document.getElementById('user-status').textContent = res.error;
        userShops = [];
    } else {
        userShops = res.shops || [];
        const addAll = `<button class="sg-btn-secondary" id="user-add-all" style="font-size:12px;padding:5px 10px;margin-bottom:8px;">Select All (${userShops.length})</button>`;
        document.getElementById('user-status').innerHTML =
            `Found ${userShops.length} shop${userShops.length !== 1 ? 's' : ''} by <b>${esc(res.username)}</b>. ` + (userShops.length ? addAll : '');
        document.getElementById('user-add-all')?.addEventListener('click', () => {
            userShops.forEach(s => selectedIds.add(s.id));
            updateBar();
            renderPicks('manual-results', manualShops);
            renderPicks('area-results', areaShops);
            renderPicks('user-results', userShops);
        });
    }
    renderPicks('user-results', userShops);
});
document.getElementById('user-q').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('user-search-btn').click();
});

// Clear / Back / Create
document.getElementById('clear-selected').addEventListener('click', () => {
    selectedIds.clear(); updateBar();
    renderPicks('manual-results', manualShops);
    renderPicks('area-results', areaShops);
    renderPicks('user-results', userShops);
});
document.getElementById('create-btn').addEventListener('click', openModal);
document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) closeModal(); });
document.getElementById('step1-next').addEventListener('click', () => {
    const name = document.getElementById('group-name-input').value.trim();
    if (!name) { document.getElementById('group-name-input').focus(); return; }
    pendingName = name;
    document.getElementById('step2-title').textContent = 'Add Shops to "' + name + '"';
    showStep(2);
});
document.getElementById('step2-back').addEventListener('click', () => showStep(1));
document.getElementById('step2-create').addEventListener('click', async () => {
    const btn = document.getElementById('step2-create');
    btn.disabled = true; btn.textContent = 'Creating…';
    const res = await fetch('/malls/api/groups', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ name: pendingName, shopIds: Array.from(selectedIds) }),
    });
    const group = await res.json();
    if (res.ok) {
        setToken(group.id, group.editToken);
        closeModal();
        window.location.href = '/malls/' + group.id;
    } else {
        btn.disabled = false; btn.textContent = 'Create Mall';
        alert(group.error || 'Failed to create mall.');
    }
});

loadGroups();
</script>
{% endblock %}
